name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --locked poe check
      - run: uv run --locked poe preview
      - run: uv run --locked poe demo
      - run: uv build
