name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv run --locked poe check
      - run: uv run --locked poe preview
      - run: uv run --locked poe demo
      - run: uv build
      - run: uv run --locked poe build-release
        if: matrix.python == '3.11'
      - run: uv run --locked poe smoke-release
        if: matrix.python == '3.11'
      - run: uv run --locked poe suite-diagrams
