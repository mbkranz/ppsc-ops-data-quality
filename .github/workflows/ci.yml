name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv sync --locked --only-group release --python 3.11.17
        env:
          UV_PROJECT_ENVIRONMENT: .venv-release
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv run --locked poe check
      - run: uv run --locked poe check-queries
      - run: uv run --locked poe check-synthetic
      - run: uv run --locked poe check-standalone
        if: matrix.python == '3.11'
      - run: UV_PYTHON=3.11.17 UV_PROJECT_ENVIRONMENT=.venv-release uv run --locked --only-group release poe build-release
        if: matrix.python == '3.11'
      - run: uv run --locked poe suite-diagrams

  windows-automation:
    runs-on: windows-latest
    env:
      DVC_NO_ANALYTICS: "1"
      UV_PROJECT_ENVIRONMENT: .venv-release
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          python-version: '3.11.17'
      - run: uv sync --locked --only-group release
      - run: uv run --no-sync --with pytest==9.1.1 pytest --noconftest -q tests/test_build_release.py tests/test_github_release.py tests/test_cloud_operations.py
