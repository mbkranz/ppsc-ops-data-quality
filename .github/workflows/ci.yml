name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint, format, and synthetic tests
        run: uv run --locked poe check
      - name: Compile an offline preview
        run: >-
          uv run --locked poe validate
          --config params.yaml
          --as-of 2026-10-15
          --lake-as-of 2026-10-17T12:00:00Z
          --output build/ci-preview
          --dry-run
