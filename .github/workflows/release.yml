name: Glue release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v*) to build and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify exact release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "$RELEASE_TAG" in v*) ;; *) echo 'Expected a v* release tag' >&2; exit 1;; esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv run --locked poe check
      - run: uv run --locked poe check-queries
      - run: uv run --locked poe check-synthetic
      - run: uv run --locked poe build-release
      - run: uv run --locked poe smoke-release
      - uses: actions/upload-artifact@v4
        with:
          name: glue-release
          path: build/release/bundle/
          if-no-files-found: error
      - name: Publish verified assets for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" build/release/bundle/* --verify-tag --generate-notes
