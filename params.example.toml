# Illustrative bindings only. Copy to ignored params.local.toml after verifying
# the catalog types, column casing, SCD2 contract and settled event timestamps.
# TOML temporal values below are typed date/datetime values, not quoted strings.
[athena]
region = "REPLACE_WITH_REGION"
database = "REPLACE_WITH_DEFAULT_DATABASE"
s3_staging_dir = "s3://REPLACE_WITH_RESULTS_BUCKET/PREFIX/"
work_group = "REPLACE_WITH_WORKGROUP"
catalog_name = "AwsDataCatalog"
# AWS credentials use the standard provider chain; do not put keys in this file.

[reports]
# Existing private bucket/prefix. Every invocation gets a fresh run UUID.
# HTML/JSON/suites/queries live under runs/; only analytics/ contains Parquet.
s3_uri = "s3://REPLACE_WITH_REPORTS_BUCKET/ppsc-data-quality/"

[databases]
account_database = "REPLACE_WITH_ACCOUNT_DATABASE"
contact_database = "REPLACE_WITH_CONTACT_DATABASE"
survey_result_database = "REPLACE_WITH_SURVEY_RESULT_DATABASE"

[event]
survey_result_id = "REPLACE_WITH_VERIFIED_EVENT_ID"
account_before_at = 2026-10-21T11:59:59
execution_at = 2026-10-21T12:00:00
account_after_at = 2026-10-21T12:05:00
flow_run_date = 2026-10-21

[rollups]
as_of = 2026-10-21T12:05:00

# Override only catalog differences; base validation-input profiles live in schemas/.
# Set all validity bounds to zoned timestamp types if passing aware datetime values.
[schema_overrides.account]
# Age_at_Time_of_Consent__pc = "decimal(18, 0)"
[schema_overrides.contact]
[schema_overrides.survey_result]
