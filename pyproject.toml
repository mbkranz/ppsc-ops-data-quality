[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ppsc-ops-data-quality"
version = "0.1.0"
description = "Composable Ibis comparisons and native GX validation for Salesforce history."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ppsc-metadata[ibis]==0.2.0",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "boto3>=1.35,<2",
  "great-expectations==1.24.0",
  "ibis-framework[duckdb]==12.0.0",
  "sqlglot==30.24.0",
  "pyarrow>=16,<27",
  "PyAthena[SQLAlchemy]>=3,<4",
  "SQLAlchemy>=2,<3",
]

[project.scripts]
ppsc-dq = "ppsc_ops_data_quality.cli:main"

[dependency-groups]
automation = ["boto3>=1.35,<2", "PyGithub==2.10.0", "pydantic>=2.12,<3", "requests>=2.32,<3", "PyYAML>=6"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "poethepoet>=0.32,<1", "graphviz>=0.20,<1", {include-group = "automation"}]
release = [
    {include-group = "automation"},
    "dvc[s3]==3.67.1",
    "hatchling==1.27.0",
    "packaging==26.3",
    "pip==25.3",
    "poethepoet==0.49.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ppsc_ops_data_quality"]

[tool.uv.sources]
ppsc-metadata = { path = "vendor/ppsc_metadata-0.2.0-py3-none-any.whl" }

[tool.poe]
executor = {type = "simple"}
include = "poe_tasks.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Ibis and GX row conditions overload == True/False as expression construction.
ignore = ["E712"]
